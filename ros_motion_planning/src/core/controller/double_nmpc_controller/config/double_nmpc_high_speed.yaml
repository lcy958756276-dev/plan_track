# Load under /move_base/DoubleNMPCController when enabling the plugin.
# These are initial values for the confirmed 0.4 m/s platform; validate them with rosbag
# before a production run. The existing APF controller remains untouched.
# Commands are refreshed at move_base/controller_frequency = 20 Hz, while the
# nonlinear prediction keeps the proven coarser 0.16 s discretization.
control_period: 0.16
command_period: 0.05
planner_period: 0.48
# Recompute the long layer at 10 Hz without changing its 0.48 s prediction step.
planner_update_period: 0.10
tracking_horizon_steps: 3
planner_horizon_steps: 6
goal_tolerance: 0.08
# Inside this range, use a stable point-capture controller. It retains the 0.08 m
# completion requirement while preventing long/short NMPC choices from alternating
# around the final path point.
terminal_approach_distance: 0.35
terminal_max_linear_velocity: 0.12
terminal_heading_threshold: 0.25

max_linear_velocity: 0.40
max_angular_velocity: 1.50
max_linear_acceleration: 0.25
max_linear_deceleration: 0.65
robot_radius: 0.16

# The planner predicts 6 x planner_period = 2.88 s but is refreshed every 0.10 s,
# independently of the 0.16 s tracking discretization. Future curvature limits
# the speed before the bend without keeping a 0.48 s stale plan.
max_lateral_acceleration: 0.35
min_curve_speed: 0.08

# Tracking-margin feedback: never relax below 5 cm. A 10 cm upper bound can be reached
# only when tracking risk is high and a lethal obstacle is inside the relevance distance.
nominal_margin: 0.06
min_margin: 0.05
max_margin: 0.10
obstacle_relevance_distance: 0.70
# Each feedback component is filtered independently before it contributes to
# tracking risk. The two risk thresholds form the margin hysteresis band.
risk_ewma_alpha: 0.22
turn_risk_ewma_alpha: 0.25
position_risk_deadzone: 0.015
position_risk_reference: 0.05
heading_risk_deadzone: 0.0035
heading_risk_reference: 0.044
input_risk_deadzone: 0.12
equivalent_body_error_reference: 0.05
risk_rise_per_cycle: 0.10
risk_fall_per_cycle: 0.05
margin_relax_risk: 0.10
margin_tighten_risk: 0.20
pressure_floor: 0.40
# Check every long-layer rollout at this maximum integration interval, including
# the intervals between the 0.48 s planner states.
safety_check_period: 0.08
# On an active turn, retain part of the nominal margin even at low tracking risk.
# 0 retains the nominal margin; 1 permits full relaxation to min_margin.
turn_relax_floor: 0.20
margin_rise_per_cycle: 0.0015
margin_fall_per_cycle: 0.0010
