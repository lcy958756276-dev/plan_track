global_frame: odom
robot_base_frame: base_footprint

update_frequency: 2.0
publish_frequency: 1.0
transform_tolerance: 0.5

static_map: false
rolling_window: true
width: 3
height: 3
resolution: 0.05

obstacle_layer:
  observation_sources: scan scan_real
  scan: {
    topic:                    /scan_fixed,
    sensor_frame:             base_scan,
    observation_persistence:  0.0,
    expected_update_rate:     0.8,
    data_type:                LaserScan,
    clearing:                 true,
    marking:                  true,
    max_obstacle_height:      0.8,
    min_obstacle_height:      0.0,
    obstacle_range:           2.0,
    raytrace_range:           3.0,
    inf_is_valid:             true
  }
  scan_real: {
    topic:                    /scan_real,
    sensor_frame:             base_scan,
    observation_persistence:  0.0,
    expected_update_rate:     5.0,
    data_type:                LaserScan,
    clearing:                 true,
    marking:                  true,
    max_obstacle_height:      0.8,
    min_obstacle_height:      0.0,
    obstacle_range:           3.0,
    raytrace_range:           3.0,
    inf_is_valid:             true
  }

inflation_layer:
  enabled:              true
  cost_scaling_factor:  10.0
  inflation_radius:     0.2
